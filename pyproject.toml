[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bargaining-platform"
version = "0.1.0"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest", "fastapi", "uvicorn", "httpx2"]

[tool.setuptools.packages.find]
include = ["bargaining_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
